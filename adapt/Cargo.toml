[package]
name = "brain-adapt"
version = "0.1.0"
edition = "2021"
description = "Tier 2 learning for brain: correction store, retrieval, adapter ledger and promotion gate"
license = "MIT OR Apache-2.0"

[lib]
name = "adapt"
path = "src/lib.rs"

[[bin]]
name = "brain-adapt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
